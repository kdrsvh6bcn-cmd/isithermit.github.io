<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bone:#e8e0d0;--dark:#060608}
body{min-height:100vh;background:var(--dark);font-family:'Space Grotesk',sans-serif;color:var(--bone);overflow-x:hidden}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 120% 80% at 50% 110%,#0d0d14 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 20% 0%,#080810 0%,transparent 50%),radial-gradient(ellipse 60% 40% at 80% 100%,#0a0a12 0%,transparent 50%),linear-gradient(160deg,#060608 0%,#0e0e18 40%,#080810 70%,#060608 100%)}

.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 40% 30% at 50% 60%,rgba(20,18,30,0.6) 0%,transparent 70%);pointer-events:none}

@keyframes glow-pulse{0%,100%{opacity:0.4}50%{opacity:0.7}}
.ambient{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(40,35,60,0.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:glow-pulse 6s ease-in-out infinite;pointer-events:none;z-index:0}

.raven{width:76px;height:76px;margin-bottom:20px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(232,224,208,0.08))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.name{font-family:'Space Mono',monospace;font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:0.1em;color:var(--bone);line-height:1;margin-bottom:10px;position:relative}
.name::before,.name::after{content:attr(data-text);position:absolute;inset:0;opacity:0}
.name::before{color:rgba(180,160,140,0.7);animation:gt1 7s infinite}
.name::after{color:rgba(100,90,80,0.5);animation:gt2 7s infinite}

@keyframes gt2{0%,94%,100%{opacity:0;transform:translate(0,0)}95%{opacity:.8;transform:translate(2px,1px);clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%)}96%{opacity:0}}

.tagline{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(232,224,208,0.32);margin-bottom:36px}
.divider{width:100%;max-width:320px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,224,208,0.15),transparent);margin-bottom:34px}

.links{display:flex;flex-direction:column;gap:11px;width:100%;max-width:340px}
.link-btn{display:flex;align-items:center;gap:13px;padding:14px 17px;background:rgba(8,8,12,0.8);border:1px solid rgba(232,224,208,0.07);border-radius:3px;text-decoration:none;color:var(--bone);font-size:13px;font-weight:500;letter-spacing:0.04em;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:border-color .2s,background .2s,transform .15s;position:relative;overflow:hidden}
.link-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac,rgba(232,224,208,0.4));opacity:0;transition:opacity .2s}
.link-btn:hover{border-color:rgba(232,224,208,0.18);background:rgba(16,16,22,.9);transform:translateX(4px)}
.link-btn:hover::before{opacity:1}
.ico{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ico svg{width:18px;height:18px}
.lbl{flex:1}
.plt{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.28;font-family:'Space Mono',monospace}
.s{--ac:#1db954}.a{--ac:#fc3c44}.y{--ac:#ff0000}.t{--ac:#2aabee}.d{--ac:#a238ff}

.footer{margin-top:42px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:rgba(232,224,208,0.12);text-align:center}

.art{position:fixed;pointer-events:none;z-index:1;opacity:0;animation:af 14s infinite}
.a1{width:36px;height:2px;background:rgba(232,224,208,0.35);top:18%;left:7%;animation-delay:0s}
.a2{width:10px;height:10px;background:rgba(232,224,208,0.12);top:65%;right:9%;animation-delay:4s}
.a3{width:52px;height:1px;background:rgba(232,224,208,0.25);top:80%;left:4%;animation-delay:8s}
.a4{width:3px;height:22px;background:rgba(232,224,208,0.18);top:38%;right:5%;animation-delay:6s}
@keyframes af{0%,89%,100%{opacity:0}90%{opacity:1;transform:translate(0,0)}91%{opacity:0;transform:translate(3px,-1px)}92%{opacity:.5}93%{opacity:0}}
</style>
