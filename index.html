<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>isithermit — Listen Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bone: #e8e0d0;
            --dark: #060608;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--bone);
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('https://d8j0ntlcm91z4.cloudfront.net/user_3Dluf3kjYKtwQRyo5MKoPva3e1o/hf_20260518_102039_5678f080-d57b-428e-af2d-eb0eafffeb00.png') center center / cover no-repeat;
            filter: brightness(0.25) contrast(1.1) saturate(0.7);
            animation: glitch-bg 12s infinite linear;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
        }

        @keyframes glitch-bg {
            0%, 100% { transform: translate(0); }
            97% { transform: translate(-2px, 1px); }
            98% { transform: translate(2px, -1px); }
        }

        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 52px 24px 80px;
        }

        .raven {
            width: 76px;
            height: 76px;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(232,224,208,0.15));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .name {
            font-family: 'Space Mono', monospace;
            font-size: clamp(28px, 8vw, 44px);
            font-weight: 700;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            text-align: center;
        }

        .tagline {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.45;
            margin-bottom: 40px;
        }

        .divider {
            width: 100%;
            max-width: 340px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232,224,208,0.2), transparent);
            margin-bottom: 36px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: rgba(12,12,16,0.85);
            border: 1px solid rgba(232,224,208,0.08);
            border-radius: 4px;
            text-decoration: none;
            color: var(--bone);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .link-btn:hover {
            border-color: rgba(232,224,208,0.25);
            background: rgba(20,20,26,0.95);
            transform: translateX(6px);
        }

        .ico {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .lbl {
            flex: 1;
        }

        .plt {
            font-size: 9px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.35;
            font-family: 'Space Mono', monospace;
        }

        .footer {
            margin-top: 60px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.2;
            text-align: center;
        }

        /* Цвета платформ */
        .s { --accent: #1db954; }
        .a { --accent: #fc3c44; }
        .y { --accent: #ff0000; }
        .t { --accent: #2aabee; }
        .d { --accent: #a238ff; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="page">
        <img class="raven" src="https://d2ol7oe51mr4n9.cloudfront.net/user_3Dluf3kjYKtwQRyo5MKoPva3e1o/ae9f9ab7-63f0-486b-a535-75ecbccbbc36.jpg" alt="isithermit">

        <h1 class="name">isithermit</h1>
        <p class="tagline">darkcore · electronic · independent</p>
        <div class="divider"></div>

        <nav class="links">
            <a href="https://open.spotify.com/artist/6GFwnbDEzSbVgVPB9JDfo8" target="_blank" class="link-btn s">
                <span class="ico">🎵</span>
                <span class="lbl">Listen on Spotify</span>
                <span class="plt">Spotify</span>
            </a>

            <a href="https://music.apple.com/us/artist/isithermit/1639461511" target="_blank" class="link-btn a">
                <span class="ico"></span>
                <span class="lbl">Listen on Apple Music</span>
                <span class="plt">Apple Music</span>
            </a>

            <a href="https://youtube.com/@isithermit" target="_blank" class="link-btn y">
                <span class="ico">▶️</span>
                <span class="lbl">YouTube</span>
                <span class="plt">YouTube</span>
            </a>

            <a href="https://t.me/isithermit" target="_blank" class="link-btn t">
                <span class="ico">✉️</span>
                <span class="lbl">Telegram Channel</span>
                <span class="plt">Telegram</span>
            </a>

            <a href="https://link.deezer.com/s/33iN9ZSnZOcMFIyT4ymnV" target="_blank" class="link-btn d">
                <span class="ico">🎧</span>
                <span class="lbl">Listen on Deezer</span>
                <span class="plt">Deezer</span>
            </a>
        </nav>

        <p class="footer">© isithermit — isolation as a sound</p>
    </div>
</body>
</html>
